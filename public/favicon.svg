<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#060609"/>
  <!-- Chilean Flag Crest Frame -->
  <g clip-path="url(#crest-clip)">
    <clipPath id="crest-clip">
      <circle cx="50" cy="50" r="38"/>
    </clipPath>
    <!-- Top White half -->
    <rect x="10" y="10" width="80" height="40" fill="#FFFFFF"/>
    <!-- Blue Canton -->
    <rect x="10" y="10" width="40" height="40" fill="#0039A6"/>
    <!-- Lone White Star -->
    <polygon points="30,22 33,31 43,31 35,37 38,46 30,41 22,46 25,37 17,31 27,31" fill="#FFFFFF"/>
    <!-- Bottom Red half -->
    <rect x="10" y="50" width="80" height="40" fill="#DC2626"/>
  </g>
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#DC2626" stroke-width="3" opacity="0.6"/>
  <!-- Center Play Glass Glyph -->
  <circle cx="50" cy="50" r="17" fill="#060609" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="46,42 58,50 46,58" fill="#FFFFFF"/>
</svg>
